name: Cdiscount availability checker

on:
  schedule:
    # One check every 5 minutes (GitHub's minimum cron interval)
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never run two checkers at the same time (a late cron trigger would otherwise overlap the previous run)
concurrency:
  group: cdiscount-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: node check_cdiscount.js
        env:
          # Repository variable PRODUCT_URL (Variables tab), or a secret of the same name as fallback
          PRODUCT_URL: ${{ vars.PRODUCT_URL || secrets.PRODUCT_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ITERATIONS: "1"

      # Backup copy of the session file (also sent on Telegram), downloadable from the workflow run page
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdiscount-session
          path: cdiscount-session-*.json
          if-no-files-found: ignore
          retention-days: 1
